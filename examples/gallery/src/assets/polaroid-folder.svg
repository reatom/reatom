<svg xmlns="http://www.w3.org/2000/svg" width="200" height="96" viewBox="0 0 200 96" fill="none" preserveAspectRatio="none">
  <defs>
    <linearGradient id="stock" x1="20" y1="0" x2="120" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f9e3a4"/>
      <stop offset=".3" stop-color="#e4c170"/>
      <stop offset=".62" stop-color="#d6ab50"/>
      <stop offset="1" stop-color="#bd8c35"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="45" x2="200" y2="65" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff2c7" stop-opacity=".4"/>
      <stop offset=".45" stop-color="#fff2c7" stop-opacity="0"/>
      <stop offset="1" stop-color="#664218" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="paper" x1="120" y1="23" x2="120" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf6"/>
      <stop offset=".5" stop-color="#eae7db"/>
      <stop offset="1" stop-color="#b9ad94"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-1" stdDeviation="2" flood-color="#392b16" flood-opacity=".5"/>
    </filter>
    <path id="jacket" d="M1 12Q1 3 11 3H149Q156 3 159 10L168 30Q170 34 176 34H190Q198 34 198 43V96H1Z"/>
    <clipPath id="clip"><use href="#jacket"/></clipPath>
  </defs>
  <!-- Only the upper edges of the contents peek above the folder shoulder. -->
  <path d="M7 32L9 27L191 24L196 28V90H7Z" fill="#89877e"/>
  <path d="M9 33V28L193 26L196 30V90H9Z" fill="url(#paper)"/>
  <path d="M10 30L193 28M10 32L194 30" stroke="#b5b2a5" stroke-width=".6"/>
  <path d="M11 32L194 31V91H11Z" fill="#f5f1e5"/>
  <g filter="url(#shadow)">
    <use href="#jacket" fill="url(#stock)"/>
  </g>
  <g clip-path="url(#clip)">
    <use href="#jacket" fill="url(#light)" filter="url(#grain)"/>
    <path d="M2 13Q2 4 12 4H149Q155 4 158 11L167 31Q169 35 176 35H190Q197 35 197 43" stroke="#fff0bf" stroke-width="1.5"/>
    <path d="M1 17V96M198 43V96" stroke="#936925" stroke-opacity=".55"/>
    <path d="M2 63Q90 61 197 64" stroke="#ae8239" stroke-opacity=".12"/>
    <path d="M2 65Q90 63 197 66" stroke="#fff4d0" stroke-opacity=".1"/>
  </g>
</svg>
